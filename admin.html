    // Helper: Ekstraksi ID Video YouTube
    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|&v=)([^#&?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Helper: Ekstraksi Embed URL Instagram
    function extractInstagramEmbed(url) {
      if (!url) return null;
      const match = url.match(/(?:instagram\.com\/(?:p|reel)\/)([\w-]+)/);
      return match ? `https://www.instagram.com/p/${match[1]}/embed` : null;
    }

    // Helper: Enkripsi Hash Password Keamanan Klien (Salted SHA-256)
    // Melindungi kredensial staf agar tidak pernah tersimpan dalam bentuk teks biasa di repositori publik
    async function computeSecureHash(plainText) {
      const salt = '::satgas_ppkpt_salt_upb::2026';
      const enc = new TextEncoder().encode(plainText + salt);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

          }

            (acc) => acc.email.toLowerCase() === normalizedEmail && acc.passwordHash === inputHash

              role: matched.role,

          if (!authUser) {

              window.location.hash = '#login';

          } else {
            if (hash === 'login' || !hash) {
              window.location.hash = '#' + activeTab;
            } else if (['beranda', 'edukasi', 'pengaturan'].includes(hash)) {
              setActiveTab(hash);
            }
          }
        };

        handleRouteGuard();
        window.addEventListener('hashchange', handleRouteGuard);
        return () => window.removeEventListener('hashchange', handleRouteGuard);
      }, [authUser, activeTab]);

      const changeTab = (tab) => {
        setActiveTab(tab);
        window.location.hash = '#' + tab;
        setIsMobileSidebarOpen(false);

          name: userData.name,
          role: userData.role,
          avatarInitials: userData.avatarInitials,
          token: 'satgas-auth-' + Date.now(),
          loggedInAt: new Date().toISOString()
        };

        if (userData.rememberMe) {
          localStorage.setItem('satgas_admin_session', JSON.stringify(session));
        } else {
          sessionStorage.setItem('satgas_admin_session', JSON.stringify(session));
        }

        setAuthUser(session);
        const targetTab = ['beranda', 'edukasi', 'pengaturan'].includes(activeTab) ? activeTab : 'beranda';
        setActiveTab(targetTab);
        window.location.hash = '#' + targetTab;
        showToast(`Selamat datang, ${userData.name}!`, 'success');
      };

      const handleLogout = () => {
        try {
          localStorage.removeItem('satgas_admin_session');
          sessionStorage.removeItem('satgas_admin_session');
        } catch (e) {}
        setAuthUser(null);
        window.location.hash = '#login';
        showToast('Anda telah keluar dari sesi admin.', 'info');

      // 1. Inisialisasi Data dari LocalStorage
      useEffect(() => {
        try {
          const rawMaster = localStorage.getItem('satgas_ppkpt_admin_edukasi');
          if (rawMaster !== null) {
            setArticles(JSON.parse(rawMaster));
          } else {
            const rawPublic = localStorage.getItem('upb_ppkpt_custom_edukasi');
            if (rawPublic !== null) {
              setArticles(JSON.parse(rawPublic));
            } else {
              setArticles(INITIAL_ARTICLES);
              saveToStorage(INITIAL_ARTICLES);
            }
          }
        } catch (e) {
          console.warn('Gagal membaca data:', e);
          setArticles(INITIAL_ARTICLES);
        }
      }, []);

      const saveToStorage = (newArticles) => {
        try {
          localStorage.setItem('satgas_ppkpt_admin_edukasi', JSON.stringify(newArticles));
          localStorage.setItem('upb_ppkpt_custom_edukasi', JSON.stringify(newArticles));
        } catch (err) {
          console.error('Gagal menyimpan:', err);

        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);

          name: authUser?.name || 'Admin Satgas PPKPT',
          role: authUser?.role || 'Pengelola',
          category: authUser?.category || '',
          email: authUser?.email || ''
        };

            id: editingArticle.id,

            lastEditedBy: currentAuthor
          } : item);

            ...formData,
            id: 'edu-' + Date.now(),
            author: currentAuthor
          };

        saveToStorage(updated);
        setIsFormModalOpen(false);
        setEditingArticle(null);

        if (!deleteTarget) return;
        const updated = articles.filter(item => item.id !== deleteTarget.id);

        saveToStorage(updated);
        setDeleteTarget(null);

        const textarea = textareaRef.current;
        if (!textarea) return;

        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selectedText = content.substring(start, end) || 'Teks yang dipilih';
        let replacement = '';

        if (type === 'bold') replacement = `**${selectedText}**`;
        else if (type === 'italic') replacement = `*${selectedText}*`;
        else if (type === 'heading') replacement = `\n\n📌 ${selectedText}\n`;
        else if (type === 'bullet') replacement = `\n- ${selectedText}`;
        else if (type === 'numbered') replacement = `\n1. ${selectedText}`;
        else if (type === 'quote') replacement = `\n> ${selectedText}\n`;

        const newText = content.substring(0, start) + replacement + content.substring(end);
        setContent(newText);
        setTimeout(() => {
          textarea.focus();
          textarea.setSelectionRange(start + replacement.length, start + replacement.length);
        }, 50);

                    }`}
                  >
                    <svg className="w-5 h-5 fill-pink-600" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    <span>Instagram</span>
                  </button>
                </div>
              </div>

              {/* 2. Judul Konten */}
              <div>
                <label className="block text-xs font-bold text-sage-900 mb-1">
                  Judul Konten <span className="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  required
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="Contoh: Sosialisasi Pencegahan Perundungan di Kampus"
                  className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-sage-900 outline-none focus:border-sage-500 focus:ring-1 focus:ring-sage-500"
                />
              </div>

              {/* 3. Kategori & Tanggal */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-sage-900 mb-1">
                    Kategori Kekerasan <span className="text-red-500">*</span>
                  </label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-sage-900 outline-none bg-white focus:border-sage-500"
                  >
                    <option value="Kekerasan Seksual">⚠️ Kekerasan Seksual</option>
                    <option value="Perundungan (Bullying)">🛑 Perundungan (Bullying)</option>
                    <option value="Tindakan Intoleransi">⚖️ Tindakan Intoleransi</option>
                    <option value="Kekerasan Fisik & Psikis">🛡️ Kekerasan Fisik &amp; Psikis</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-sage-900 mb-1">
                    Tanggal Terbit
                  </label>
                  <input
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-xs text-sage-900 outline-none focus:border-sage-500"
                  />
                </div>
              </div>

              {/* 4. INTEGRASI MEDIA PINTAR (YouTube / Instagram) */}
              {(contentType === 'youtube' || contentType === 'instagram') && (
                <div className="p-4 bg-gray-50 rounded-2xl border border-sage-200 space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-sage-900 mb-1">
                      {contentType === 'youtube' ? '🎥 Masukkan Link / URL Video YouTube:' : '📸 Masukkan Link / URL Postingan Instagram:'}
                    </label>
                    <input
                      type="url"
                      required
                      value={mediaUrl}
                      onChange={(e) => setMediaUrl(e.target.value)}
                      placeholder={
                        contentType === 'youtube'
                          ? 'Contoh: https://www.youtube.com/watch?v=... atau https://youtu.be/...'
                          : 'Contoh: https://www.instagram.com/p/... atau https://www.instagram.com/reel/...'
                      }
                      className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs text-sage-900 outline-none bg-white focus:border-sage-500"
                    />
                    <p className="text-[11px] text-gray-500 mt-1">
                      💡 Cukup tempelkan link URL biasa. Sistem kami akan otomatis mengubahnya menjadi tampilan video/postingan langsung.
                    </p>
                  </div>

                  {/* LIVE PREVIEW YOUTUBE (SESUAI RASIO 16:9 ATAU SHORTS 9:16) */}
                  {contentType === 'youtube' && (
                    <div>
                      {youtubeId ? (
                        <div className="space-y-1.5">
                          <div className="flex items-center justify-between">
                            <span className="text-[11px] font-bold text-green-700 flex items-center gap-1">
                              ✓ Video Berhasil Ditemukan:
                            </span>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-800 border border-red-200">
                              {mediaUrl.includes('/shorts/') ? 'Rasio Vertikal Shorts 9:16' : 'Rasio Lebar Standar 16:9'}
                            </span>
                          </div>
                          <div className={`rounded-xl overflow-hidden border border-gray-200 bg-black ${
                            mediaUrl.includes('/shorts/') ? 'aspect-[9/16] max-w-xs mx-auto' : 'aspect-video w-full'
                          }`}>
                            <iframe
                              src={`https://www.youtube.com/embed/${youtubeId}`}
                              className="w-full h-full"
                              frameBorder="0"
                              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                              allowFullScreen
                            />
                          </div>
                        </div>
                      ) : mediaUrl ? (
                        <div className="p-2.5 bg-amber-50 rounded-xl border border-amber-200 text-[11px] text-amber-800">
                          ⚠️ Link YouTube belum valid. Pastikan link diawali dengan https://youtube.com/watch?v=... atau https://youtu.be/...
                        </div>
                      ) : null}
                    </div>
                  )}

                  {/* LIVE PREVIEW INSTAGRAM (SESUAI RASIO PORTRAIT 4:5) */}
                  {contentType === 'instagram' && (
                    <div>
                      {instagramEmbedUrl ? (
                        <div className="space-y-1.5">
                          <div className="flex items-center justify-between">
                            <span className="text-[11px] font-bold text-green-700 flex items-center gap-1">
                              ✓ Postingan Berhasil Ditemukan:
                            </span>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-pink-100 text-pink-800 border border-pink-200">
                              Rasio Asli Instagram 4:5
                            </span>
                          </div>
                          <div className="flex justify-center bg-white p-2 rounded-xl border border-gray-200 overflow-hidden">
                            <iframe
                              src={instagramEmbedUrl}
                              className="w-full max-w-sm aspect-[4/5] min-h-[460px] rounded-lg"
                              frameBorder="0"
                              scrolling="no"
                              allowTransparency="true"
                            />
                          </div>
                        </div>
                      ) : mediaUrl ? (
                        <div className="p-2.5 bg-amber-50 rounded-xl border border-amber-200 text-[11px] text-amber-800">
                          ⚠️ Link Instagram belum valid. Pastikan link postingan diawali dengan https://www.instagram.com/p/...
                        </div>
                      ) : null}
                    </div>
                  )}
                </div>
              )}

              {/* 5. Ringkasan Singkat */}
              <div>
                <label className="block text-xs font-bold text-sage-900 mb-1">
                  Ringkasan Singkat (Muncul di Kartu Tampilan Depan)
                </label>
                <textarea
                  rows="2"
                  value={summary}
                  onChange={(e) => setSummary(e.target.value)}
                  placeholder="Tuliskan ringkasan 1-2 kalimat seputar materi ini..."
                  className="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-xs text-sage-900 outline-none focus:border-sage-500"
                />
              </div>

              {/* 6. WYSIWYG Rich Text Editor (Khusus Artikel Teks) */}
              {contentType === 'text' && (
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="block text-xs font-bold text-sage-900">
                      Isi Lengkap Artikel
                    </label>
                    <span className="text-[11px] text-gray-400">Gunakan tombol pemformat di bawah untuk merapikan teks</span>
                  </div>

                  {/* Toolbar Pemformatan Sederhana (WYSIWYG Buttons) */}
                  <div className="flex items-center flex-wrap gap-1 p-1.5 bg-sage-50 rounded-xl border border-sage-200">
                    <button
                      type="button"
                      onClick={() => applyFormatting('bold')}
                      className="px-2.5 py-1 rounded-lg bg-white border border-sage-200 text-xs font-bold text-sage-900 hover:bg-sage-100"
                      title="Teks Tebal"
                    >
                      B Tebal
                    </button>
                    <button
                      type="button"
                      onClick={() => applyFormatting('italic')}
                      className="px-2.5 py-1 rounded-lg bg-white border border-sage-200 text-xs italic text-sage-900 hover:bg-sage-100"
                      title="Teks Miring"
                    >
                      I Miring
                    </button>
                    <button
                      type="button"
                      onClick={() => applyFormatting('heading')}
                      className="px-2.5 py-1 rounded-lg bg-white border border-sage-200 text-xs font-bold text-sage-900 hover:bg-sage-100"
                      title="Judul Sub-Bab"
                    >
                      📌 Sub-Judul
                    </button>
                    <button
                      type="button"
                      onClick={() => applyFormatting('bullet')}
                      className="px-2.5 py-1 rounded-lg bg-white border border-sage-200 text-xs font-bold text-sage-900 hover:bg-sage-100"
                      title="Daftar Titik"
                    >
                      • Poin
                    </button>
                    <button
                      type="button"
                      onClick={() => applyFormatting('numbered')}
                      className="px-2.5 py-1 rounded-lg bg-white border border-sage-200 text-xs font-bold text-sage-900 hover:bg-sage-100"
                      title="Daftar Nomor"
                    >
                      1. Angka
                    </button>
                    <button
                      type="button"
                      onClick={() => applyFormatting('quote')}
                      className="px-2.5 py-1 rounded-lg bg-white border border-sage-200 text-xs font-bold text-sage-900 hover:bg-sage-100"
                      title="Kotak Catatan Penting"
                    >
                      ❝ Catatan
                    </button>
                  </div>

                  <textarea
                    ref={textareaRef}
                    rows="6"
                    value={content}
                    onChange={(e) => setContent(e.target.value)}
                    placeholder="Ketik isi artikel atau materi edukasi Anda di sini..."
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-sage-900 outline-none focus:border-sage-500 leading-relaxed font-sans"
                  />
                </div>
              )}

            </form>

            {/* Modal Footer (Tombol Simpan dalam Warna Sage Green & Batal) */}
            <div className="px-6 py-4 border-t border-sage-100 bg-gray-50 flex items-center justify-between gap-3 flex-shrink-0">
              <button
                type="button"
                onClick={onClose}
                className="px-5 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-100 text-gray-700 font-bold text-xs transition-colors"
              >
                Batal
              </button>

              <button
                type="submit"
                form="content-form"
                className="px-6 py-2.5 rounded-xl bg-sage-700 hover:bg-sage-800 text-white font-bold text-xs shadow-sm transition-all flex items-center gap-1.5"
              >
                <span>💾</span>
                <span>Simpan</span>
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
